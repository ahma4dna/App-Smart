plugins {
    id "com.android.application"
    id "kotlin-android"
    id 'com.google.gms.google-services'
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.shoapsmart_useers_laerm"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // تحديد المعرف الفريد للتطبيق
        applicationId = "com.example.shoapsmart_useers_laerm"
        // تحديد الحد الأدنى للإصدار ليكون 23 بدلاً من 21
        minSdkVersion 23  // زيادة minSdkVersion إلى 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // إضافة إعدادات التوقيع
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // إضافة المكتبة الخاصة بـ Firebase باستخدام BOM لتحديد النسخة بشكل تلقائي
    implementation platform('com.google.firebase:firebase-bom:33.8.0')

    // يمكن إضافة مكتبات Firebase أخرى حسب الحاجة
    implementation 'com.google.firebase:firebase-auth'
    // أي مكتبات أخرى مثل firebase-firestore أو firebase-database
}

buildscript {
    repositories {
        google()  // تأكد من أنك قمت بإضافة google() كمستودع
        mavenCentral()
    }
    dependencies {
        // النسخة الصحيحة من الأدوات الخاصة بـ Android
        classpath 'com.android.tools.build:gradle:8.1.1'  // تأكد من استخدام النسخة الصحيحة
        // النسخة الصحيحة من Google Services Plugin
        classpath 'com.google.gms:google-services:4.3.15'  // النسخة التي يجب تحديدها
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
